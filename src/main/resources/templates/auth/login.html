<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'login')}">
<body>
  <h2>Login</h2>
  <div class="alert alert-success" th:if="${param.registered}">Registration successful. Please log in to continue.</div>
  <form th:object="${loginForm}" th:action="@{/login}" method="post" class="form-horizontal">
    <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input id="username" class="form-control" th:field="*{username}" autocomplete="username" autofocus>
      <div class="text-danger" th:errors="*{username}"></div>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password" type="password" class="form-control" th:field="*{password}" autocomplete="current-password">
      <div class="text-danger" th:errors="*{password}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Login</button>
    <a class="btn btn-link" th:href="@{/register}">Create an account</a>
  </form>
</body>
</html>
